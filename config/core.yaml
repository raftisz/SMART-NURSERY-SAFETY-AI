# CCTV Core configuration
# ค่าตัวเลขในไฟล์นี้เป็นค่าเริ่มต้นสำหรับทดลอง ยังไม่ได้ปรับจากผลทดสอบจริง
# (config.yaml เดิมที่ root ใช้กับ detect.py ต่อไปตามเดิม ไม่เกี่ยวกับไฟล์นี้)

cameras:
  - id: cam0
    name: "Notebook Camera"
    source: 0
    width: 1280            # ทดสอบด้วยมือที่ 1280x720 (docs/eval/hazard_imgsz_manual.md)
    height: 720
    flip: true             # กลับภาพซ้ายขวาเหมือน detect.py (เว็บแคมหันหน้าเข้าหาตัวเอง)
  # กล้องสมมติสำหรับคลิปทดสอบของ QA (tools/eval_clips.py) โซนของคลิป QA วาดด้วย
  #   python tools/define_zone.py --camera qa --source <คลิป> --name <ชื่อโซน>
  # run_core.py ใช้กล้องตัวแรก (cam0) เสมอ ถ้าไม่ได้ระบุ --camera
  - id: qa
    name: "QA clips"
    source: ""
    flip: false

# Detection modules: detector + policy คู่กัน
#   enabled: false = ปิด module นั้น
#   run_every_n_frames: รันทุก N เฟรม เพื่อให้หลายโมเดลรันบน Mac เครื่องเดียวได้
modules:
  - detector:
      class: "src.detectors.hazard_object:HazardObjectDetector"
      # imgsz 960: ของชิ้นเล็กได้ conf สูงขึ้นในการทดสอบด้วยมือ (docs/eval/hazard_imgsz_manual.md)
      params: {weights: "yolo11n.pt", conf: 0.25, imgsz: 960, nms_iou: 0.5, run_every_n_frames: 1}
    # โมเดลเดียวส่งผลให้ 2 กฎ: ของมีคม + เด็กออกนอกพื้นที่ (ใช้กรอบ person ชุดเดียวกัน ไม่รันโมเดลเพิ่ม)
    policies:
      - class: "src.cctv_core.events.policies:LabelMatchPolicy"
        # person อย่างเดียวไม่นับเป็นเหตุการณ์ (เหมือน detect.py เดิม)
        params: {event_type: hazard_object, labels: [scissors, knife], min_confidence: 0.25}
      - class: "src.policies.out_of_area:OutOfAreaPolicy"
        # โซนอยู่ใน config/zones.yaml สร้างด้วย: python tools/define_zone.py --name <ชื่อโซน>
        # child_ratio: สูงไม่ถึงกี่เท่าของผู้ใหญ่ที่ยืนจุดเดียวกัน = เด็ก (เด็ก 2-6 ขวบ ประมาณ 0.5-0.75)
        params: {zones_file: "config/zones.yaml", min_confidence: 0.4, child_ratio: 0.75}

  - detector:
      class: "src.detectors.smoking:SmokingDetector"
      params: {weights: "models/smoking/best.pt", conf: 0.5, run_every_n_frames: 2}
    policy:
      class: "src.cctv_core.events.policies:LabelMatchPolicy"
      params:
        event_type: smoking
        labels: [smoking, cigarette]
        min_confidence: 0.5
        # สวิตช์: ไม่นับ cigarette ที่กรอบซ้อนกับ scissors/knife ของ hazard_object ในเฟรมเดียวกัน
        # (กรรไกรถูกอ่านเป็น cigarette 0.60 วันที่ 25 ก.ย. และ 4 ต.ค.) ค่าเริ่มต้นปิด จนกว่าวัดผลบนคลิป s2 แล้วดีกว่า
        # ต้องให้ hazard_object อยู่ก่อน smoking ใน modules
        ignore_if_overlapping: {enabled: false, labels: [cigarette], with: [scissors, knife]}

  # Pose: ปีนป่าย + ทะเลาะวิวาท ใช้ผล Pose ชุดเดียวกัน (รันโมเดลครั้งเดียว)
  # ปิดไว้ก่อน (ลด FPS): เปิดเฉพาะรอบด้วย  python run_core.py --modules climbing_pose
  # ยังไม่มี weight ของโปรเจกต์ ใช้ yolo11n-pose.pt แบบ pretrained แทน
  - enabled: false
    detector:
      class: "src.detectors.climbing_pose:ClimbingPoseDetector"
      params: {weights: "yolo11n-pose.pt", conf: 0.3, run_every_n_frames: 2}
    policies:
      - class: "src.detectors.climbing_pose:ClimbingPosePolicy"
        params: {event_type: climbing, require_both: true}
      - class: "src.policies.fight:FightPolicy"
        # ค่าเริ่มต้นสำหรับทดลอง ต้องปรับจากคลิป QA (ตัวเลข spd บนกรอบคนช่วยปรับ speed_threshold)
        params: {event_type: fight, close_gap: 0.15, speed_threshold: 1.5, speed_window_s: 0.5}

  # ควัน v2: โมเดลฝึกเอง (models/smoke/README.md) ยังไม่ได้วัดผลกับกล้องจริงนอกจากเทสสด 5 ครั้งห้องเดียว
  # ปิดไว้ก่อน: เปิดเฉพาะรอบด้วย  python run_core.py --modules smoke --console-only
  # conf 0.25 / imgsz 640 เท่ากับ tools/smoke_live_test.py; sha256 ต้องตรงก่อนเปิดไฟล์ .pt
  # อยู่ท้ายสุดเพื่อไม่เปลี่ยน context ที่ smoking ใช้
  - enabled: false
    detector:
      class: "src.detectors.smoke:SmokeDetector"
      params:
        weights: "models/smoke/smoke_custom_yolo11n_v2.pt"
        sha256: "2a97455c6f96252dfcedf92c149154db1b32d8eee0ef0028bb2d9c80cad95876"
        conf: 0.25
        imgsz: 640
        run_every_n_frames: 2
    policy:
      class: "src.cctv_core.events.policies:LabelMatchPolicy"
      params: {event_type: smoke, labels: [smoke], min_confidence: 0.25}

events:
  # ค่าตั้งต้นของทุกประเภท
  default:
    severity: MEDIUM
    confirm_hits: 3        # ต้องเห็นกี่ครั้ง...
    confirm_window_s: 2.0  # ...ภายในกี่วินาที จึงยืนยันเป็นเหตุการณ์
    close_after_s: 10.0    # ไม่เห็นนานเท่านี้ = เหตุการณ์จบ
    cooldown_s: 30.0       # เท่ากับ line_cooldown_seconds เดิมใน config.yaml
  # ค่าเฉพาะประเภท (ใส่เฉพาะที่ต่างจาก default)
  types:
    hazard_object: {severity: HIGH}
    smoking: {severity: MEDIUM}
    climbing: {severity: HIGH}
    # อยู่ในโซนต่อเนื่องกี่วินาทีจึงแจ้งเตือน (ปรับได้ตามต้องการ)
    out_of_area: {severity: HIGH, min_duration_s: 3.0}
    # ต้องเห็นท่าทะเลาะต่อเนื่อง 1 วินาที (ตัดไฮไฟว์หรือการแตะตัวครั้งเดียว)
    fight: {severity: HIGH, min_duration_s: 1.0, max_gap_s: 0.8}
    # ควันต้องเห็นต่อเนื่อง 2 วินาที (หายเกิน 1 วินาทีเริ่มนับใหม่) ตัดเฟรมผิดที่โผล่สั้นๆ
    # ค่าตั้งต้น ยังไม่ได้วัด; cooldown 60 วินาที เพราะควันค้างนาน ไม่ให้แจ้งซ้ำทุก 30 วินาที
    smoke: {severity: MEDIUM, min_duration_s: 2.0, max_gap_s: 1.0, cooldown_s: 60.0}

storage:
  database: data/events.db       # ถูก ignore ใน git
  snapshots_dir: data/snapshots  # ถูก ignore ใน git

notifications:
  channels:
    console: {enabled: true}
    line: {enabled: false}   # เปิดเมื่อพร้อม และต้องมีค่าใน .env
  routes:
    - {channels: [console], event_types: "*", min_severity: INFO}
    - {channels: [line], event_types: "*", min_severity: MEDIUM}
